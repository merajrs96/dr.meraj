<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Nexora Dashboard</title>
<style>
  body {
    margin:0; font-family:'Arial',sans-serif;
    background:#0f172a; color:#fff;
  }
  a {color:#38bdf8; text-decoration:none;}
  header {
    position:fixed; top:0; left:0; right:0;
    height:60px; background:#111827; display:flex;
    justify-content:space-between; align-items:center;
    padding:0 20px; z-index:100;
  }
  .menu-toggle {cursor:pointer; font-size:24px;}
  .dashboard-box {
    max-width:800px; margin:100px auto 40px;
    background:#111827; border-radius:15px;
    padding:30px; text-align:center; position:relative;
  }
  .avatar-circle {
    width:80px; height:80px; border-radius:50%;
    background:#000; margin:0 auto 15px;
    display:flex; justify-content:center; align-items:center;
    cursor:pointer; font-size:36px;
  }
  .avatar-circle.selected {border:3px solid #ff0000;}
  .info-field {margin:10px 0;}
  input {width:60%; padding:8px; border-radius:5px; border:none; text-align:center;}
  button {margin-top:20px;padding:10px 20px;border:none;border-radius:8px;background:#ff0000;color:#fff;cursor:pointer;font-size:16px;}
  .tabs {display:flex; justify-content:center; gap:40px; margin-top:30px; border-top:1px solid #333; padding-top:20px;}
  .tab {cursor:pointer; padding:10px 20px; border-radius:8px; background:#111827; transition:0.3s;}
  .tab.active {background:#38bdf8; color:#000;}
  .tab-content {margin-top:20px;}
  .projects-empty {display:flex; justify-content:center; align-items:center; flex-direction:column; color:#777; height:100px;}
  .overlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.8); display:none;
    justify-content:center; align-items:center; z-index:200;
  }
  .overlay form {background:#111827; padding:30px; border-radius:15px; width:300px; text-align:center;}
  .overlay input, .overlay select {width:90%; margin:10px 0; padding:8px; border-radius:5px; border:none;}
  .overlay button {background:#ff0000;}
  footer {
    position:fixed; bottom:0; left:0; right:0; height:50px;
    background:#111827; display:flex; justify-content:center;
    align-items:center; color:#fff; font-size:14px;
  }
  .avatar-list {display:flex; justify-content:center; gap:10px; margin-bottom:15px;}
  .avatar-list div {width:50px; height:50px; border-radius:50%; display:flex; justify-content:center; align-items:center; cursor:pointer; font-size:24px; background:#111827; color:#ff0000; transition:0.3s;}
  .avatar-list div.selected {border:2px solid #ff0000;}
</style>
</head>
<body>

<header>
  <div class="menu-toggle">☰</div>
  <div>Nexora Dashboard</div>
  <div>👤 Meraj</div>
</header>

<div class="dashboard-box">
  <!-- Avatar انتخابی -->
  <div class="avatar-list" id="avatarList">
    <div data-icon="🐺">🐺</div>
    <div data-icon="🦁">🦁</div>
    <div data-icon="🐯">🐯</div>
    <div data-icon="🐻">🐻</div>
    <div data-icon="🦇">🦇</div>
  </div>
  <div class="avatar-circle" id="avatar">🐺</div>

  <div class="info" id="infoBox">
    <div class="info-field">Name: Meraj Rastegar</div>
    <div class="info-field">Phone: 09xx</div>
    <div class="info-field"><input placeholder="Job"></div>
    <div class="info-field"><input placeholder="Gender"></div>
    <div class="info-field"><input placeholder="Age"></div>
    <div class="info-field"><input placeholder="Country"></div>
  </div>
  <button id="completeProfileBtn">Complete Your Profile</button>

  <div class="tabs">
    <div class="tab active" data-tab="projects">Projects</div>
    <div class="tab" data-tab="newProject">New Project</div>
    <div class="tab" data-tab="history">History</div>
  </div>

  <div class="tab-content" id="tabContent">
    <div class="projects-empty">📦 No projects yet</div>
  </div>
</div>

<div class="overlay" id="profileOverlay">
  <form id="profileForm">
    <h3>Complete Your Profile</h3>
    <input placeholder="Job">
    <input placeholder="Gender">
    <input placeholder="Age">
    <input placeholder="Country">
    <button type="button" id="saveProfileBtn">Confirm & Save</button>
    <button type="button" id="closeOverlayBtn">Cancel</button>
  </form>
</div>

<footer>
  © 2025 Nexora - All rights reserved
</footer>

<script>
const completeBtn = document.getElementById('completeProfileBtn');
const overlay = document.getElementById('profileOverlay');
const closeOverlayBtn = document.getElementById('closeOverlayBtn');
const saveProfileBtn = document.getElementById('saveProfileBtn');
const tabBtns = document.querySelectorAll('.tab');
const tabContent = document.getElementById('tabContent');
const infoBox = document.getElementById('infoBox');
const avatarList = document.getElementById('avatarList');
const avatarCircle = document.getElementById('avatar');

// ==== Avatar انتخاب ====
avatarList.querySelectorAll('div').forEach(a=>{
  a.onclick = ()=>{
    avatarList.querySelectorAll('div').forEach(av=>av.classList.remove('selected'));
    a.classList.add('selected');
    avatarCircle.textContent = a.dataset.icon;
    localStorage.setItem('avatar', a.dataset.icon);
  }
});
// بارگذاری avatar ذخیره شده
const savedAvatar = localStorage.getItem('avatar');
if(savedAvatar){ avatarCircle.textContent = savedAvatar; }

// Complete Profile overlay
completeBtn.onclick = ()=> overlay.style.display='flex';
closeOverlayBtn.onclick = ()=> overlay.style.display='none';

saveProfileBtn.onclick = ()=>{
  const inputs = document.querySelectorAll('#profileForm input');
  const profileData = {};
  inputs.forEach(input => { profileData[input.placeholder] = input.value; });

  // ذخیره در localStorage
  localStorage.setItem('profile', JSON.stringify(profileData));

  // بروزرسانی Info Box
  infoBox.innerHTML = `
    <div class="info-field">Name: Meraj Rastegar</div>
    <div class="info-field">Phone: 09xx</div>
    <div class="info-field">Job: ${profileData['Job']}</div>
    <div class="info-field">Gender: ${profileData['Gender']}</div>
    <div class="info-field">Age: ${profileData['Age']}</div>
    <div class="info-field">Country: ${profileData['Country']}</div>
  `;

  // حذف دکمه Complete
  completeBtn.style.display = 'none';
  overlay.style.display = 'none';
};

// ==== Projects ====
let projects = JSON.parse(localStorage.getItem('projects') || '[]');

function renderProjects(){
  if(projects.length === 0){
    tabContent.innerHTML = '<div class="projects-empty">📦 No projects yet</div>';
  } else {
    tabContent.innerHTML = '<ul>' + projects.map(p=>`<li>📁 ${p}</li>`).join('') + '</ul>';
  }
}

// New Project دکمه
tabContent.addEventListener('click', e=>{
  if(e.target.tagName==='BUTTON' && e.target.textContent==='+ New Project'){
    let newProj = prompt('Project Name:');
    if(newProj){
      projects.push(newProj);
      localStorage.setItem('projects', JSON.stringify(projects));
      renderProjects();
    }
  }
});

// Tabs
tabBtns.forEach(tab=>{
  tab.onclick = ()=>{
    tabBtns.forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    if(tab.dataset.tab==='projects'){ renderProjects(); }
    else if(tab.dataset.tab==='newProject'){
      tabContent.innerHTML = '<button>+ New Project</button>';
    } else{
      tabContent.innerHTML = '<div>History log will appear here</div>';
    }
  }
});

// بار اول رندر
renderProjects();

// ==== بارگذاری پروفایل ذخیره شده ====
const savedProfile = JSON.parse(localStorage.getItem('profile'));
if(savedProfile){
  infoBox.innerHTML = `
    <div class="info-field">Name: Meraj Rastegar</div>
    <div class="info-field">Phone: 09xx</div>
    <div class="info-field">Job: ${savedProfile['Job']}</div>
    <div class="info-field">Gender: ${savedProfile['Gender']}</div>
    <div class="info-field">Age: ${savedProfile['Age']}</div>
    <div class="info-field">Country: ${savedProfile['Country']}</div>
  `;
  completeBtn.style.display = 'none';
}
</script>

</body>
</html>
